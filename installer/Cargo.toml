[package]
name = "alicenation-korean"
version = "1.2.2"
edition = "2024"
default-run = "alicenation-korean"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
qbsdiff = "1.4"
fs2 = "0.4"
tempfile = "3.27"
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "pack-payload"
path = "src/bin/pack_payload.rs"
